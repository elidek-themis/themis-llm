version: 1

formatters:
  simple:
    format: "[%(pathname)s] %(levelname)s %(asctime)s %(filename)s:%(lineno)d] %(message)s"
  custom:
    class: themis.utils.tools.CustomFormatter
    # datefmt: "%m-%d %H:%M:%S"
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: custom
    stream: ext://sys.stdout
  file:
    class: logging.FileHandler
    level: INFO
    formatter: custom
    filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log

root:
  level: INFO
  handlers: [console, file]
  propagate: yes
loggers:
  vllm:
    level: INFO
    handlers: [console, file]
    propagate: no
  hydra:
    level: INFO
    handlers: [console, file]
    propagate: no
  lm_eval:
    level: INFO
    handlers: [console, file]
    propagate: no


disable_existing_loggers: false
