[tool.poetry]
name = "themis-llm"
version = "0.1.0"
description = "Themis"
authors = ["Panagiotis Papadakos <papadako@gmail.com>, Christos Karanikolopoulos <chkaranikolopoulos@cs.uoi.gr>"]
readme = "README.md"
# packages = [{include = "themis"}]
packages = [
    { include = "themis"},
    { include = "themis_st"}
]

# themis-cli = "themis.interfaces.cli.controller:main"
# themis-ui = "themis_st.app.main:run"

[tool.poetry.dependencies]
python = "^3.12"
ipykernel = "^6.29.5"
ipywidgets = "^8.1.5"
pandas = "^2.2.2"
matplotlib = "^3.9.1"
vllm = "^0.8.3"
huggingface-hub = {extras = ["cli"], version = "^0.30.2"}
wandb = "^0.17.4"
lm-eval = "^0.4.8"
click = "^8.1.7"
coolname = "^2.2.0"
hydra-core = "^1.3.2"
pydantic = "^2.9.2"
seaborn = "^0.13.2"
pydantic-yaml = "^1.3.0"
rich = "^13.9.4"
plotly = "^6.0.1"
openpyxl = "^3.1.5"
streamlit = {version = "^1.43.2", optional = true}
streamlit-extras = "^0.6.0"
streamlit-code-editor = "^0.1.22"
st-pages = "^1.0.1"


[tool.poetry.group.dev.dependencies]
python-dotenv = "^1.0.1"
chardet = "^5.2.0"
black = "^25.1.0"
pylint = "^3.3.6"
pre-commit = "^4.2.0"
flake8 = "^7.2.0"
importlib-metadata = "4.13"

[tool.poetry.extras]
st = ["streamlit"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
