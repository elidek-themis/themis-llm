[project]
name = "themis-llm"
version = "0.1.0"
description = "Themis"
authors = [
  { name = "Christos Karanikolopoulos", email = "chkaranikolopoulos@cs.uoi.gr" },
  { name = "Panagiotis Papadakos", email = "papadako@gmail.com" }
]
requires-python = "~=3.12"
readme = "README.md"
dependencies = [
    "python-dotenv>=1.0.1,<2",
    "hydra-core>=1.3.2,<2",
    "pydantic>=2.9.2,<3",
    "pydantic-yaml>=1.3.0,<2",
    "rich>=13.9.4,<14",
    "coolname>=2.2.0,<3",
    "pandas>=2.2.2,<3",
    "tinydb>=4.8.2",
    "huggingface-hub[cli]>=0.30.2,<0.31",
    "vllm>=0.8.3,<0.9",
    "lm-eval>=0.4.8,<0.5",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0,<5",
    "ruff>=0.11.7",
]

type-checking = [
    "mypy>=1.15.0",

]

viz = [
    "ipykernel>=6.29.5,<7",
    "ipywidgets>=8.1.5,<9",
    "streamlit>=1.43.2,<2",
    "streamlit-extras>=0.6.0,<0.7",
    "streamlit-code-editor>=0.1.22,<0.2",
    "st-pages>=1.0.1,<2",
    "matplotlib>=3.9.1,<4",
    "seaborn>=0.13.2,<0.14",
    "plotly>=6.0.1,<7",
    "openpyxl>=3.1.5,<4", # UI table coloring
]

[tool.hatch.build.targets.wheel]
include = [
    "themis",
    "themis_st",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "themis",
    "themis_st",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".git", ".vscode"]

[tool.ruff.lint]
select = [
    "I",    # isort
    "B",    # flake8-bugbear
    "C",    # flake8-comprehensions
    "E",    # pycodestyle
    "F",    # Pyflakes
    "W",    # pycodestyle warnings
    "B9",   # flake8-bugbear
    "UP",   # pyupgrade
    "PL",   # pylint
    # "G"  # logging
]
ignore = [
    "W191",     # indentation-with-tabs, handled by ruff-format
    "E731",     # lambda-assignment
    "B905",     # zip-without-explicit-strict
    "PLR0913",  # too-many-arguments
    "PLC0414"   # useless-import-alias
]

[tool.ruff.lint.per-file-ignores]
"themis_st/**/*.py" = ["PLR2004"]  # magic-value-comparison

[tool.ruff.lint.isort]
from-first = false
length-sort = true
lines-between-types = 1
known-first-party = ["themis", "themis_st"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy] # gradually enable strictness
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
follow_imports = "normal"
disable_error_code = ["import-untyped"] # for third-party libraries
exclude = [
    "tasks/",
    "themis/data/builders/",            # huggingface datasets
    "themis/definitions/registry.py",   # decorator functions
    "themis/core/controller.py",        # config composition
]
