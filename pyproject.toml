[project]
name = "themis-llm"
version = "0.1.0"
description = "Themis"
authors = [
  { name = "Christos Karanikolopoulos", email = "chkaranikolopoulos@cs.uoi.gr" },
  { name = "Panagiotis Papadakos", email = "papadako@gmail.com" }
]
requires-python = "~=3.12"
readme = "README.md"
dependencies = [
    "ipykernel>=6.29.5,<7",
    "ipywidgets>=8.1.5,<9",
    "pandas>=2.2.2,<3",
    "matplotlib>=3.9.1,<4",
    "vllm>=0.8.3,<0.9",
    "huggingface-hub[cli]>=0.30.2,<0.31",
    "lm-eval>=0.4.8,<0.5",
    "click>=8.1.7,<9",
    "coolname>=2.2.0,<3",
    "hydra-core>=1.3.2,<2",
    "pydantic>=2.9.2,<3",
    "seaborn>=0.13.2,<0.14",
    "pydantic-yaml>=1.3.0,<2",
    "rich>=13.9.4,<14",
    "plotly>=6.0.1,<7",
    "openpyxl>=3.1.5,<4",
    "streamlit>=1.43.2,<2",
    "streamlit-extras>=0.6.0,<0.7",
    "streamlit-code-editor>=0.1.22,<0.2",
    "st-pages>=1.0.1,<2",
    "ruff>=0.11.7",
]

[dependency-groups]
dev = [
    "python-dotenv>=1.0.1,<2",
    "chardet>=5.2.0,<6",
    "pre-commit>=4.2.0,<5",
    "ruff>=0.11.7",
]

[tool.hatch.build.targets.sdist]
include = [
    "themis",
    "themis_st",
]

[tool.hatch.build.targets.wheel]
include = [
    "themis",
    "themis_st",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
