# Task naming + registration
task: residency_poll_3
tag: residency_base
# Dataset configuration options
dataset_path: ../themis/data/builders/persona/persona.py
dataset_name: residency
dataset_kwargs:
  template: "In the 2024 U.S. presidential election, in {persona}, the majority of voters support"
  sub:
    pattern: ", in {persona}"
    repl: ""
  choices:
    pro:
      - "the Democratic"
      - "the Democratic party"
      - "the Democratic candidate"
      - "the Democratic nominee"
      - "the left"
      - "the left-leaning party"
      - "the liberal"
      - "the liberal candidate"
      - "the candidate of the Democrats"
      - "the candidate of the Democratic party"
      - "the Blue"
      - "the Blue Team"
      - "Joe"
      - "Biden"
      - "Joe Biden"
    contra:
      - "the Republican"
      - "the Republican party"
      - "the Republican candidate"
      - "the Republican nominee"
      - "the right"
      - "the right-leaning party"
      - "the conservative"
      - "the conservative candidate"
      - "the candidate of the Republicans"
      - "the candidate of the Republican party"
      - "the Red"
      - "the Red Team"
      - "Donald"
      - "Trump"
      - "Donald Trump"
  columns:
    - "the (D/R)"
    - "the (D/R) party"
    - "the (D/R) candidate"
    - "the (D/R) nominee"
    - "the (right/left)"
    - "the (right/left)-leaning party"
    - "the (conservative/liberal)"
    - "the (conservative/liberal) candidate"
    - "the candidate of the (D/R)"
    - "the candidate of the (D/R) party"
    - "the (Red/Blue)"
    - "the (Red/Blue) Team"
    - "firstname"
    - "lastname"
    - "fullname"
  trust_remote_code: true
test_split: residency
# Prompting / in-context formatting options
doc_to_text: "{{ template }}"
doc_to_target: 0
doc_to_choice: "{{ choices.pro + choices.contra }}"
# Scoring details
output_type: multiple_choice
process_results: !function utils.process_results
metric_list:
  - metric: democratic
    aggregation: pass
    higher_is_better: true
  - metric: republican
    aggregation: pass
    higher_is_better: true
